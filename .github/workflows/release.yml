name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

# Pre-empt the June 2 2026 GitHub Actions Node 24 cutover. Forces all
# JS-based actions (setup-zig, etc.) to run on Node 24 regardless of
# their action.yml-declared runtime.
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-linux-musl
            archive-name: linux-arm64
            runner: ubuntu-24.04-arm
          - target: x86_64-linux-musl
            archive-name: linux-amd64
            runner: ubuntu-latest
          - target: aarch64-macos-none
            archive-name: darwin-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.16.0

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build for ${{ matrix.archive-name }}
        shell: bash
        run: |
          # macOS: native build using the runner's system SDK via xcrun.
          # Cross-compiling with -Dtarget=...-macos-none uses Zig's bundled
          # libc subset; under Zig 0.16 translate-c chokes on Mach types
          # like mach_msg_descriptor_t (declared opaque while @sizeOf
          # assertions are emitted against them). Native build matches the
          # host SDK and avoids the issue.
          # Linux: keep the explicit musl target for static linking and
          # cross-compile between arm64/amd64.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            zig build \
              -Doptimize=ReleaseSafe \
              -Dstrip=true \
              --prefix dist
          else
            zig build \
              -Dtarget=${{ matrix.target }} \
              -Doptimize=ReleaseSafe \
              -Dstrip=true \
              --prefix dist
          fi

      - name: Copy man pages
        run: mkdir -p dist/share/man/man1 && cp man/man1/* dist/share/man/man1/

      - name: Create tarball
        run: >
          tar -czf
          vibeutils-${{ steps.version.outputs.version }}-${{ matrix.archive-name }}.tar.gz
          -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vibeutils-${{ matrix.archive-name }}
          path: vibeutils-*.tar.gz

  release:
    timeout-minutes: 30
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Homebrew bottle
        id: bottle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BOTTLE_NAME="vibeutils-${VERSION}.arm64_sequoia.bottle.tar.gz"

          # Extract darwin-arm64 binary tarball
          mkdir -p extracted
          tar -xzf "artifacts/vibeutils-${VERSION}-darwin-arm64.tar.gz" -C extracted

          # Build bottle directory structure
          mkdir -p "bottle/vibeutils/${VERSION}/bin"
          mkdir -p "bottle/vibeutils/${VERSION}/libexec/vibebin"
          mkdir -p "bottle/vibeutils/${VERSION}/share/man/man1"

          # Install binaries with 'v' prefix
          for f in extracted/bin/*; do
            name=$(basename "$f")
            [ "$name" = "[" ] && continue
            cp "$f" "bottle/vibeutils/${VERSION}/bin/v${name}"
          done

          # Create vibebin symlinks (unprefixed -> prefixed)
          for f in bottle/vibeutils/${VERSION}/bin/v*; do
            name=$(basename "$f" | sed 's/^v//')
            ln -s "../../bin/v${name}" "bottle/vibeutils/${VERSION}/libexec/vibebin/${name}"
          done

          # Copy man pages
          if [ -d extracted/share/man/man1 ]; then
            cp extracted/share/man/man1/* "bottle/vibeutils/${VERSION}/share/man/man1/"
          fi

          # Create bottle tarball and compute SHA
          tar -czf "${BOTTLE_NAME}" -C bottle .
          cp "${BOTTLE_NAME}" "artifacts/${BOTTLE_NAME}"

          BOTTLE_SHA=$(sha256sum "${BOTTLE_NAME}" | awk '{print $1}')
          echo "sha256=${BOTTLE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Compute source tarball SHA256 for Homebrew
        id: sha
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          curl -sfL "https://github.com/kelp/vibeutils/archive/refs/tags/${TAG}.tar.gz" -o source.tar.gz
          SHA=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Delete existing draft release
        run: gh release delete ${{ steps.version.outputs.tag }} --yes || true

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Notes between "## vX.Y.Z — DATE" and the next "## v" heading
          awk -v ver="$VERSION" '
              $0 ~ "^## v" ver " " {found=1; next}
              found && /^## v/ {exit}
              found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Error: no notes found for v${VERSION} in CHANGELOG.md"
            exit 1
          fi

      - name: Create GitHub release (draft)
        run: >
          gh release create ${{ steps.version.outputs.tag }}
          artifacts/vibeutils-*.tar.gz
          --draft
          --title "vibeutils ${{ steps.version.outputs.version }}"
          --notes-file release-notes.md

      - name: Publish release
        run: gh release edit ${{ steps.version.outputs.tag }} --draft=false

      - name: Checkout Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: kelp/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          FORMULA="homebrew-tap/Formula/vibeutils.rb"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_SHA="${{ steps.sha.outputs.sha256 }}"
          BOTTLE_SHA="${{ steps.bottle.outputs.sha256 }}"

          SOURCE_URL="https://github.com/kelp/vibeutils/archive/refs/tags/${TAG}.tar.gz"
          BOTTLE_URL="https://github.com/kelp/vibeutils/releases/download/${TAG}"

          awk -v source_url="$SOURCE_URL" \
              -v source_sha="$SOURCE_SHA" \
              -v bottle_url="$BOTTLE_URL" \
              -v bottle_sha="$BOTTLE_SHA" \
          '{
            if (/^  url /) { print "  url \"" source_url "\""; next }
            if (/^  sha256 / && !in_bottle) { print "  sha256 \"" source_sha "\""; next }
            if (/^  bottle do/) { in_bottle=1 }
            if (in_bottle && /root_url/) { print "    root_url \"" bottle_url "\""; next }
            if (in_bottle && /arm64_sequoia/) { print "    sha256 cellar: :any_skip_relocation, arm64_sequoia: \"" bottle_sha "\""; next }
            if (/^  end/ && in_bottle) { in_bottle=0 }
            print
          }' "$FORMULA" > "${FORMULA}.tmp" && mv "${FORMULA}.tmp" "$FORMULA"

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vibeutils.rb
          git commit -m "Update vibeutils to ${{ steps.version.outputs.version }}"
          git push

  push-cachix:
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: macos-26
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: vibeutils
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build and push to Cachix
        run: nix build --print-out-paths | cachix push vibeutils
