name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Doptimize=ReleaseSafe --prefix dist

      - name: Copy man pages
        run: mkdir -p dist/share/man/man1 && cp man/man1/* dist/share/man/man1/

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tarball
        run: >
          tar -czf vibeutils-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
          -C dist .

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 vibeutils-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Delete existing draft release
        run: gh release delete ${{ steps.version.outputs.tag }} --yes || true

      - name: Create GitHub release
        run: >
          gh release create ${{ steps.version.outputs.tag }}
          vibeutils-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
          --title "vibeutils ${{ steps.version.outputs.version }}"
          --generate-notes

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: kelp/homebrew-vibeutils
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          FORMULA="homebrew-tap/Formula/vibeutils.rb"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="https://github.com/kelp/vibeutils/releases/download/${TAG}/vibeutils-${VERSION}-darwin-arm64.tar.gz"
          sed -i '' "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA}\"|" "$FORMULA"

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vibeutils.rb
          git commit -m "Update vibeutils to ${{ steps.version.outputs.version }}"
          git push

  push-cachix:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: vibeutils
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build
