name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-linux-gnu
            archive-name: linux-arm64
          - target: x86_64-linux-gnu
            archive-name: linux-amd64
          - target: aarch64-macos-none
            archive-name: darwin-arm64
          - target: x86_64-macos-none
            archive-name: darwin-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build for ${{ matrix.archive-name }}
        run: >
          zig build
          -Dtarget=${{ matrix.target }}
          -Doptimize=ReleaseSafe
          --prefix dist

      - name: Copy man pages
        run: mkdir -p dist/share/man/man1 && cp man/man1/* dist/share/man/man1/

      - name: Create tarball
        run: >
          tar -czf
          vibeutils-${{ steps.version.outputs.version }}-${{ matrix.archive-name }}.tar.gz
          -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeutils-${{ matrix.archive-name }}
          path: vibeutils-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Compute SHA256 for Homebrew
        id: sha
        run: |
          SHA=$(sha256sum artifacts/vibeutils-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Delete existing draft release
        run: gh release delete ${{ steps.version.outputs.tag }} --yes || true

      - name: Create GitHub release
        run: >
          gh release create ${{ steps.version.outputs.tag }}
          artifacts/vibeutils-*.tar.gz
          --title "vibeutils ${{ steps.version.outputs.version }}"
          --generate-notes

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: kelp/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          FORMULA="homebrew-tap/Formula/vibeutils.rb"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="https://github.com/kelp/vibeutils/releases/download/${TAG}/vibeutils-${VERSION}-darwin-arm64.tar.gz"
          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" "$FORMULA"

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vibeutils.rb
          git commit -m "Update vibeutils to ${{ steps.version.outputs.version }}"
          git push

  push-cachix:
    strategy:
      matrix:
        include:
          - os: macos-14
          - os: macos-15-intel
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: vibeutils
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build
