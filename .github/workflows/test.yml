name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: make test
      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - run: make build
      - run: make it
      - name: Run privileged tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot
          make test-privileged

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov
      - run: make coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: zig-out/coverage/merged/
