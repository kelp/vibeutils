name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep JS actions on Node 24 if an action.yml still names an older
# runtime. This does not silence deprecation warnings; those go away
# only when the loaded action.yml declares node24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Cache apt packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-mandoc
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - uses: ./.github/actions/setup-just
      - run: just docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: zig-out/docs
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        id: deployment