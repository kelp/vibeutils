name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep JS actions on Node 24 if an action.yml still names an older
# runtime. This does not silence deprecation warnings; those go away
# only when the loaded action.yml declares node24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - uses: ./.github/actions/setup-just
      - name: Run integration tests
        run: just it
